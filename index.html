<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>連江縣老宅延壽機能復新計畫 - 3D 政策微縮模型群島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c85327;
      --primary-dark: #9c3c16;
      --primary-light: #faede6;
      --accent: #2a8298;
      --ink: #1e242c;
      --ink-soft: #4b5563;
      --glass-bg: rgba(255, 252, 248, 0.93);
      --glass-border: rgba(255, 255, 255, 0.88);
      --shadow: 0 16px 36px rgba(28, 22, 16, 0.14);
      --font-family: "Noto Sans TC", "Source Han Sans TW", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-family);
      background: radial-gradient(circle at center, #ffffff 0%, #faede1 100%);
      color: var(--ink); user-select: none; transition: background 0.8s ease;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
    
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow);
      border-radius: 20px;
      z-index: 10;
      position: absolute;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* 頂部品牌卡 */
    #brand-card {
      top: 20px; left: 24px; padding: 12px 20px;
      display: flex; align-items: center; gap: 14px; cursor: pointer;
    }
    #brand-card:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(200, 83, 39, 0.18); }
    .brand-tag {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #e07a5f);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 900; font-size: 19px;
      box-shadow: 0 6px 14px rgba(200, 83, 39, 0.35);
    }
    .brand-text h1 { font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: 0.5px; }
    .brand-text p { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; }

    /* 右側七大多媒體與輔導互動資源 Dock */
    #resource-dock {
      top: 20px; right: 24px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dock-btn {
      background: transparent; border: none; outline: none;
      padding: 9px 15px; border-radius: 12px;
      display: flex; align-items: center; gap: 10px;
      font-size: 13.5px; font-weight: 700; color: var(--ink);
      cursor: pointer; transition: all 0.2s ease;
      font-family: inherit; text-align: left;
    }
    .dock-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      transform: translateX(-4px);
    }
    .dock-btn span.icon { font-size: 18px; }

    /* 底部時段、視角與巡航導覽 HUD */
    #hud-bottom {
      bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; display: flex; align-items: center; gap: 7px;
      border-radius: 9999px;
    }
    .hud-btn {
      background: transparent; border: none; outline: none;
      padding: 7px 13px; border-radius: 9999px;
      font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
      cursor: pointer; transition: all 0.2s ease;
      font-family: inherit; display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .hud-btn:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }
    .hud-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(200, 83, 39, 0.35);
    }
    .hud-divider { width: 1.5px; height: 18px; background: rgba(0, 0, 0, 0.12); margin: 0 3px; }

    /* 左下角島嶼特色情報卡 */
    #detail-card {
      bottom: 24px; left: 24px; width: 340px; padding: 18px 22px;
      transform-origin: bottom left;
    }
    #detail-card.hidden {
      transform: scale(0.9) translateY(40px);
      opacity: 0; pointer-events: none;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-badge {
      background: var(--primary); color: white;
      font-size: 12px; font-weight: 800; padding: 3px 9px;
      border-radius: 6px; display: inline-block;
    }
    .card-close {
      background: transparent; border: none; font-size: 18px;
      cursor: pointer; color: var(--ink-soft); padding: 2px 6px;
    }
    .card-title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
    .card-sub { font-size: 12.5px; color: var(--primary-dark); font-weight: 700; margin-bottom: 8px; }
    .card-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 12px; }
    .card-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .stat-box {
      background: rgba(200, 83, 39, 0.06); padding: 8px 10px; border-radius: 10px;
    }
    .stat-box .val { font-size: 13.5px; font-weight: 800; color: var(--primary); }
    .stat-box .lbl { font-size: 11px; color: var(--ink-soft); }
    .card-extra {
      font-size: 11.5px; color: #78716c; border-top: 1px dashed rgba(0, 0, 0, 0.12);
      padding-top: 8px; line-height: 1.45;
    }

    /* 3D 浮動標籤 (CSS2D) */
    .island-badge-label {
      background: var(--glass-bg);
      border: 1.5px solid var(--primary);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-radius: 9999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; align-items: center; gap: 4px;
    }
    .island-badge-label:hover {
      transform: scale(1.1) translateY(-4px);
      background: var(--primary);
      color: white;
      border-color: white;
    }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-content {
      background: #ffffff; border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      width: 100%; max-width: 920px; max-height: 88vh;
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
    .modal-close {
      position: absolute; top: 18px; right: 22px; width: 34px; height: 34px;
      border-radius: 50%; border: 1px solid #e2e8f0; background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: var(--ink-soft); z-index: 10;
      transition: all 0.2s;
    }
    .modal-close:hover { background: #f1f5f9; color: var(--primary); }
    #modal-body { padding: 28px 32px; overflow-y: auto; flex: 1; }

    /* 試算器內部樣式 */
    .calc-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
    .tab-btn {
      background: none; border: none; padding: 8px 16px; font-size: 14.5px;
      font-weight: 700; color: #64748b; cursor: pointer; border-radius: 8px;
    }
    .tab-btn.active { background: var(--primary-light); color: var(--primary); }
    .calc-layout { display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; }
    @media (max-width: 768px) { .calc-layout { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-control {
      width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1;
      border-radius: 10px; font-size: 14px; outline: none; font-family: inherit;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(200, 83, 39, 0.15); }
    .res-box {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 1.5px solid #fed7aa; border-radius: 16px; padding: 20px;
    }
    .res-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .res-val-big { font-size: 32px; font-weight: 900; color: #c2410c; }
    .res-val-mid { font-size: 22px; font-weight: 800; color: #1e293b; }

    /* 表格樣式 */
    .custom-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .custom-table th, .custom-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .custom-table th { background: #f8fafc; color: #475569; font-weight: 700; }
    .custom-table tr:hover td { background: #f8fafc; }

    /* Q&A Accordion */
    .qa-item { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .qa-q {
      padding: 14px 18px; font-weight: 700; font-size: 14.5px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; background: #ffffff;
    }
    .qa-q:hover { background: #f8fafc; }
    .qa-a {
      padding: 16px 18px; background: #fafafa; border-top: 1px solid #f1f5f9;
      font-size: 13.5px; color: #334155; line-height: 1.65; display: none;
      white-space: pre-line;
    }
    .qa-item.open .qa-a { display: block; }

    /* 載入中動畫遮罩 */
    #loader {
      position: fixed; inset: 0; background: #faede1; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 46px; height: 46px; border: 4px solid rgba(200, 83, 39, 0.2);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- 載入動畫遮罩 -->
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size:15px; font-weight:800; color:var(--primary-dark);">連江老宅延壽 3D 微縮世界加載中...</div>
  </div>

  <div id="canvas-container"></div>

  <!-- 頂部品牌卡 -->
  <div id="brand-card" class="glass-panel" onclick="resetOverviewCamera()">
    <div class="brand-tag">3F</div>
    <div class="brand-text">
      <h1>連江老宅延壽島 <span style="color:var(--primary); font-size:13px; font-weight:900;">3D 微縮模型</span></h1>
      <p>四鄉五島機能復新探索・中央島＋四鄉緊湊微縮布局</p>
    </div>
  </div>

  <!-- 右側七大多媒體與輔導互動資源 Dock -->
  <div id="resource-dock" class="glass-panel">
    <button class="dock-btn" onclick="openModal('calc')">
      <span class="icon">🧮</span> 補助即時試算 (40組情境)
    </button>
    <button class="dock-btn" onclick="openModal('qa')">
      <span class="icon">📖</span> 政策 QA 手冊 (50題全收錄)
    </button>
    <button class="dock-btn" onclick="openModal('agencies')">
      <span class="icon">🏛️</span> 32 家結構初評機構
    </button>
    <button class="dock-btn" onclick="openModal('flow')">
      <span class="icon">📝</span> 舊有房屋證明＋地政登記
    </button>
    <button class="dock-btn" onclick="openModal('forms')">
      <span class="icon">📂</span> 申請表單與專區 QR Code
    </button>
    <button class="dock-btn" onclick="openModal('video')">
      <span class="icon">🎬</span> 宣傳影音與公版簡報
    </button>
    <button class="dock-btn" onclick="openModal('contact')">
      <span class="icon">📞</span> 駐府諮詢專線
    </button>
  </div>

  <!-- 左下角島嶼特色情報卡 -->
  <div id="detail-card" class="glass-panel hidden">
    <div class="card-header">
      <span class="card-badge" id="card-badge">南竿鄉</span>
      <button class="card-close" onclick="closeDetailCard()">✕</button>
    </div>
    <div class="card-title" id="card-title">福澳港示範連棟公寓群</div>
    <div class="card-sub" id="card-sub">全縣政經行政樞紐・連棟老宅更新示範</div>
    <div class="card-desc" id="card-desc">...</div>
    <div class="card-stats" id="card-stats"></div>
    <div class="card-extra" id="card-extra"></div>
    <button class="hud-btn active" style="width:100%; justify-content:center; margin-top:12px;" onclick="openModal('calc')">
      🧮 立即試算該區老宅補助額度
    </button>
  </div>

  <!-- 底部時段、視角與巡航導覽 HUD -->
  <div id="hud-bottom" class="glass-panel">
    <button class="hud-btn active" id="btn-day" onclick="setDayTime('day', this)">☀️ 溫暖晨曦</button>
    <button class="hud-btn" id="btn-sunset" onclick="setDayTime('sunset', this)">🌅 閩江暮色</button>
    <button class="hud-btn" id="btn-night" onclick="setDayTime('night', this)">🌙 藍調璀璨夜</button>
    <div class="hud-divider"></div>
    <button class="hud-btn" onclick="resetOverviewCamera()">🌐 全景微縮</button>
    <button class="hud-btn" onclick="setTopView()">📐 CAD 正俯視</button>
    <div class="hud-divider"></div>
    <button class="hud-btn" onclick="tourPrev()" title="巡航上一站">◀ 上一站</button>
    <button class="hud-btn" id="btn-tour-play" onclick="toggleTourPlay()" title="自動依序巡弋各島">▶ 導覽播放</button>
    <button class="hud-btn" onclick="tourNext()" title="巡航下一站">▶ 下一站</button>
    <span id="tour-indicator" style="font-size:12px; font-weight:800; color:var(--primary); padding:0 8px; white-space:nowrap;">【全景微縮】</span>
  </div>

  <!-- 互動彈窗集合 -->
  <div id="main-modal" class="modal-overlay" onclick="onModalOverlayClick(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

      qaList: [{"code": "A-01", "category": "A", "categoryName": "概要基礎篇", "num": 1, "question": "為何要推動「老宅延壽」?", "answer": "考量國內刻正面臨⼈屋雙老議題，內政部因此研訂老宅延壽機能復新計畫，優先針對 \n屋齡30年以上4至6樓公寓住宅及6樓以下透天住宅建築物，補助修繕室內外空間，可 \n以申請補助項目包括:管線修繕更新、建物立面修繕、屋頂防水、新增昇降設備及無 \n障礙設備等，讓老宅經由適當的修繕強化機能，讓⻑者可以在宅安⼼養老，避免再面 \n臨換屋的困擾，也符合永續循環淨零。"}, {"code": "A-02", "category": "A", "categoryName": "概要基礎篇", "num": 2, "question": "「老宅延壽」的法令依據為何？什麼時候可以開始申請?有受理期限 嗎？", "answer": "(1)法令依據： \n本計畫是依據 114 年 8 月 1 日 總統公布之「因應國際情勢強化經濟社會及⺠⽣國安 \n韌性特別條例」第 3 條第8 款「加強照顧弱勢提供關懷服務」規定所訂定。 \n內政部已訂定「老宅延壽機能復新計畫」及「因應國際情勢強化老舊建築物修繕補助 \n辦法」，作為推動依據。 \n上述計畫與辦法均已於115 年發布實施。 \n(2)開始申請時間： \n有關受理時間將 由地方主管機關公告，請⺠眾屆時可留意各直轄市、縣（市）政府 \n發布之相關資訊 。 \n(3)受理期限： \n本計畫為短期示範補助計畫，計畫年期預計執行至  116年 12 月 31 日止 。"}, {"code": "A-03", "category": "A", "categoryName": "概要基礎篇", "num": 3, "question": "「老宅延壽機能復新計畫」僅有3年，有可能變成⻑期推動計畫？", "answer": "「老宅延壽機能復新計畫」目前定位為試行計畫，相關補助辦法已於115年正式發布 \n實施。本計畫針對屋齡30年以上之4至6層公寓及6層以下透天住宅提供補助，旨在優 \n化建築機能與無障礙空間，達成永續與淨零目標。申請時間由地方主管機關公告，原 \n則於5月底開始受理，執行至116年底。計畫期間將進行滾動式檢討，未來將視試執 \n行的實際情形與成效，再行考量後續是否延續或調整為⻑期推動計畫，以提供⺠眾完 \n善的在宅老齡化⽣活環境。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nA-2"}, {"code": "A-04", "category": "A", "categoryName": "概要基礎篇", "num": 4, "question": "何種建築物可適用「老宅延壽」申請修繕？", "answer": "(1)老宅延壽計畫優先針對全國屋齡30年以上4至6樓公寓住宅及6樓以下透天住宅之 \n合法建築物，提供公寓共有與專有部分以及透天室內外之修繕補助。 \n(2)修繕是以「⼀棟」為申請單位；有關合法建築物之認定，要依據使用執照或經地 \n方政府認定之合法建築物證明文件為準。"}, {"code": "A-05", "category": "A", "categoryName": "概要基礎篇", "num": 5, "question": "合法建築物如何認定? 證明文件有哪些?", "answer": "有關合法建築物之認定是看使用執照或舊有房屋證明+建物登記謄本+建物測量成果 \n圖。"}, {"code": "A-06", "category": "A", "categoryName": "概要基礎篇", "num": 6, "question": "「老宅延壽」為何以4~6層樓公寓住宅及1~6層樓透天為補助對象？ 其他華廈及大樓也可以補助嗎?", "answer": "(1)4~6層樓老舊公寓住宅由於早年興建未納入電梯規劃，且外牆磁磚剝落、管線老 \n舊造成漏水等問題，並造成住戶及高齡均有不便，另為兼顧地區均衡發展，配合中南 \n部住宅類型，將透天住宅⼀併納入，經由適當的修繕強化機能，以延⻑建築物使用年 \n限，讓⻑者可以在宅安⼼養老。 \n(2)依補助辦法規定，老宅延壽補助不適用於6樓以上華廈或大樓等建築物，如有建築 \n物立面修繕補助需求，建議可以申請都市更新整建維護相關補助。 \n(3)所謂4~6層樓公寓住宅係指建築物「總樓層數」為4層、5層或6層之建築物，總樓 \n層數3層樓以下非補助對象。 \n(4)所謂1~6層樓透天係指「總樓層數」為1層、2層、3層、4層、5層或6層之建築 \n物。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nA-3"}, {"code": "A-07", "category": "A", "categoryName": "概要基礎篇", "num": 7, "question": "「老宅延壽」有何獎助措施？", "answer": "老宅延壽機能復新計畫，補助項目包括: \n(1)補助結構安全性能評估，包含初步評估或詳細評估。  \n(2)4至6樓公寓住宅修繕補助: \n①公共空間「共用」部分修繕，包含增設昇降設備、樓 梯間修繕、公共管線修繕更 \n新、老舊招牌、違規物或違建 拆除、建物立面修繕、屋頂防水及隔熱、外掛式空調 \n及外 部管線之安全改善工程以及增設或改善無障礙設施等8項。 \n②4至6樓公寓住宅私⼈室內有「專有」部分修繕，包含居家無障礙環境修繕（如扶 \n手更新或加裝、高低差改善、門扇改善、地面防滑及防墜設施等）以及管線繕更新 \n（如給排水管線、電氣管線及燃氣管線等） \n其中，「屋頂防水及隔熱」補助項目，不包含以鐵⽪搭設之防水屋頂；建議⺠眾得併 \n同申請「經濟部家戶設置屋頂太陽光電加速計畫補助」，以整合屋頂改善及節能效 \n益。另，既有電梯設備之修繕，不在本計畫補助範疇內。 \n(3)6樓以下透天住宅之建築物修繕補助: \n①室外修繕，包含立面修繕、屋頂防水及隔熱、外掛式空調及外部管線之安全改善工 \n程、增設或改善室外無障礙設施等4項。 \n②室內修繕，包含居家安全無障礙設施設備改善、管線修繕更新等。 \n補助項目中「屋頂防水及隔熱」之補助，不包含以鐵⽪搭 設作為防水用途之屋頂； \n另，違章建築拆除所需費用，亦 不納入補助範圍。增設電梯設備，不再本計畫補助 \n範疇內。有關補助項目中之「室內修繕」，須係配合辦理防滑改善、無障礙扶手設置 \n或更新、管線更新等相關改善工程所衍⽣ 之裝修內容，始得納入補助範圍。 \n(4)同時透過成立中央及地方顧問團提供⺠眾相關協助機制，以儘快改善國⼈安全的 \n⽣活環境。"}, {"code": "A-08", "category": "A", "categoryName": "概要基礎篇", "num": 8, "question": "申請修繕前，是否⼀定要先辦理「建築物結構安全性能評估」？", "answer": "(1)要，申請⼈申請修繕補助，必須先依「都市危險及老舊建築物結構安全性能評估 \n辦法」規定辦理初步評估或詳細評估(⼆擇⼀)，讓建築物所有權⼈瞭解持有建築物結 \n構安全狀況，並視評估結果及所有權⼈整合意願情形決定建築物將進行修繕、補強措 \n施或重建。 \n(2)另本計畫也提供結構安全性能初步或詳細評估之費用補助，減輕申請⼈負擔。   \n \n老宅延壽機能復新補助計畫   \n \n \nA-4"}, {"code": "A-09", "category": "A", "categoryName": "概要基礎篇", "num": 9, "question": "建築物結構安全性能（耐震能力）評估結果，會否影響「老宅延壽」 申請？", "answer": "(1)原則上不影響申請，建築物結構安全性能（耐震能力）評估結果，是讓建築物所 \n有權⼈瞭解持有建築物結構安全狀況。 \n(2)如有提高建築物耐震能力之需求，也可以另外向國土署 (住宅組)申請弱層補強工 \n程補助。"}, {"code": "A-10", "category": "A", "categoryName": "概要基礎篇", "num": 10, "question": "「老宅延壽」與「都市更新整建維護」有何不同？", "answer": "(1)都市更新整建維護，是依據「都市更新條例」規定程序處理都市計畫地區更新單 \n元內原有建築物之改建、修建或維護；由於都市更新應以增進公共利益及改善都市景 \n觀為原則，故應以建築物外牆立面及屋頂修繕為主要補助項目，且違規物、違建或與 \n使照竣工圖說不符者，應⼀併處理。 \n(2)老宅延壽係為因應國內⼈屋雙老課題，希望在短期內改善並優化老舊建築物機能 \n與無障礙空間品質，增進高齡者行動的便利性及居住舒適性，優先針對30年以上4至\n6樓公寓住宅及6樓以下透天住宅，補助改善居住室內外環境，同時也呼應相關部會 \n重大政策，包括衛福部⻑照政策、經濟部ESCO 節能政策及本部住宅政策。 \n(3)兩者之政策目的、補助對象與條件、推動方式都不同，比較如下表: \n \n項目  老宅延壽機能復新  都市更新整建維護  \n目的  \n為因應國內⼈屋雙老課題，透過優化建築物機能與無障 \n礙空間品質，增進高齡者行動的便利性及居住舒適性； \n並呼應相關部會重大政策，包括衛福部⻑照政策、經濟 \n部ESCO節能政策及本部住宅政策。 \n \n為改善都市景觀及居住環境，並增進公共利 \n益。 \n \n補助對象  管委會、管理負責⼈、全體區分所有權⼈  更新會、管委會。  \n補助範圍  補助屋齡30年以上4至6樓公寓住宅及6樓以下透天住宅， \n改善項目除了室外環境之外，也包含室內空間的改善。 \n \n補助屋齡20年以上建築物，改善項目僅含外 \n牆立面及屋頂等修繕為主。 \n \n補助條件  \nA.已辦理結構安全性能評估初步評估或詳細評估。  \nB.公寓住宅使用比率應達1/2以上 (按使用執照登載所住 \n宅使用之樓地板面積或戶數計算)，透天全棟須為住宅。  \nC.除6樓以下透天住宅外，公寓建築物內設籍之戶籍成員 \n應包括下列其中1項: \n年滿65歲以上之⻑者。  \n具(中)低收入戶資格。  \n屬⻑照需要等級第2級以上且符合居家無障礙環境改善補 \n助對象。  \nA.位於都市計畫地區。  \nB.符合直轄市、縣(市)主管機關所定更新單元 \n劃定基準。  \n補助程序  \n免經都市更新作業及審議程序，簡化提案及審查程序， \n檢齊補助計畫書及應備文件送由地方政府書面審查隨即 \n可核准補助。 \n \n1.補助程序應由需經地方政府初審及中央複 \n審通過，始得核予補助。 \n \n2.另應依都市更新條例所定程序辦理相關作 \n業。 \n  \n  \n \n老宅延壽機能復新補助計畫   \n \n \nA-5"}, {"code": "A-11", "category": "A", "categoryName": "概要基礎篇", "num": 11, "question": "結構安全性能(耐震能力)評估的申請程序為何？", "answer": ""}, {"code": "A-12", "category": "A", "categoryName": "概要基礎篇", "num": 12, "question": "結構安全性能評估機構有無限制？誰可以提供協助？", "answer": "(1)有的，結構安全性能評估機構，應由中央主管機關評定之共同供應契約機構始能 \n辦理。 \n(2)⺠眾如欲辦理結構安全性能評估可上網查詢本署評定之共同供應契約機構 \n(https://twur.nlma.gov.tw/zh/theme/main/69/主題專區/老宅延壽專區/文件下載/\n危老結構安全性能評估共同供應契約機構名冊(32家)。 \n  \n舊有房屋證明 +建物登記謄本 +建物測量成果圖  \n+建物登記謄本+建物測量成果圖 \n \n老宅延壽機能復新補助計畫   \n \n \nA-6"}, {"code": "A-13", "category": "A", "categoryName": "概要基礎篇", "num": 13, "question": "結構安全性能評估有補助嗎？如何申請？", "answer": "針對「都市危險及老舊建築物（危老）」提供初步評估與詳細評估補助，最高補助額 \n度視面積而定，初步評估總樓地板面積未達3,000平方公尺者，每棟補助新臺幣1.2萬\n元，總樓地板面積達3,000平方公尺以上者，每棟補助新臺幣1.5萬元；詳細評估每棟 \n補助額度以評估費用30%為限，且補助上限不得超過新臺幣40萬元)。申請需檢附申 \n請書、房屋權狀影本、建物登記謄本及管理委員會報備文件（或同意書），向房屋所 \n在地縣市政府都市發展局或工務局提出申請。"}, {"code": "A-14", "category": "A", "categoryName": "概要基礎篇", "num": 14, "question": "辦理結構安全性能評估要多少錢?", "answer": "⺠眾如有辦理結構安全性能評估需求，可至本署網站查詢經評定之共同供應契約機 \n構，並逕洽相關評估機構辦理。至於評估費用，仍依各評估機構實際報價為準，建議 \n⺠眾可多方洽詢比較後，再行選擇合適之評估單位。"}, {"code": "A-15", "category": "A", "categoryName": "概要基礎篇", "num": 15, "question": "如果已經辦理過結構安全性能評估，是不是就不用再評估?", "answer": "是的，如⺠眾先前已持有結構安全性能評估報告書，原則上無須重新辦理，且無期限 \n之限制。 \n \n \n \n老宅延壽機能復新補助計畫"}, {"code": "B-01", "category": "B", "categoryName": "法令適用篇", "num": 1, "question": "已向地方政府申請過整建維護補助，還可以再申請「老宅延壽」嗎?", "answer": "可以，但同⼀棟建築物已依其他法令或計畫申請相同補助項目並獲核准者，不得再申 \n請「老宅延壽」之同⼀補助項目；例如公寓專有部分修繕補助部分，如已依其他法令 \n或計畫申請補助建築物立面修繕，則不得再申請「老宅延壽」的建築物立面修繕補 \n助，但可以申請其他室外及室內修繕的補助。"}, {"code": "B-02", "category": "B", "categoryName": "法令適用篇", "num": 2, "question": "申請「老宅延壽」補助是否須配合拆除違章建築或違規物（突出外牆 面之鐵窗、雨遮、頂樓加蓋等）", "answer": "不用。合法建築物常見之附屬違章建築或違規物（如突出外牆面之鐵窗、雨遮、頂樓 \n加蓋等），不會因申請本計畫而被強制要求拆除。 \n另，申請⼈如有改善需求，亦可考量申請「老舊招牌、違規物及違章建築拆除工程」 \n相關補助。惟仍建議⺠眾避免於修繕過程中，⾃行增建或變更施作內容而形成新的違 \n章建築；如有相關認定疑義，建議洽詢所在地地方建築主管機關。"}, {"code": "B-03", "category": "B", "categoryName": "法令適用篇", "num": 3, "question": "公寓的定義？住宅比率怎麼算?屋齡如何認定？", "answer": "(1)公寓通常指⼀棟建築內劃分成很多獨立住家的建築物，每⼀戶都有⾃⼰的獨立出 \n入口及⽣活空間，但建築物結構、樓梯、⾛廊、屋頂等公共區域則是所有住戶⼀起共 \n有和管理。 \n(2)住宅比率係指住宅使用之樓地板面積或戶數，必須超過總樓地板面積或總戶數1/2 \n以上。住宅使用比率以使用執照登載為準；無法出具使用執照者，就以地政機關核發 \n之建物登記謄本所載資料計算。 \n(3)⼀般以建築物屋齡是使用執照登載竣工日期起算。 \n(4)取得合法房屋證明之建築物，其屋齡認定，則以合法房屋證明文件所載明之屋齡 \n為準。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nB-2"}, {"code": "B-04", "category": "B", "categoryName": "法令適用篇", "num": 4, "question": "透天住宅的定義？非住宅使用的透天能否補助？如何認定？", "answer": "(1)透天住宅（⼜稱透天厝），⼀般指的是⼀種整棟上下樓都屬於同⼀戶使用的住 \n家。它通常是獨棟或連棟，透天的樓層可以從地下室⼀路連通到頂樓，是同⼀戶的完 \n整空間，不像公寓那樣分層給不同住戶使用。而且透天的土地和建物通常都是同⼀個 \n屋主持有，不像公寓那樣有很多分層所有權⼈。 \n(2)依補助辦法規定，補助6樓以下透天住宅建築物，全棟應作住宅使用，且所有權⼈ \n應為⾃然⼈。 \n住宅使用比率是以使用執照登載為準；無法出具使用執照者，就以地政機關核發之建 \n物登記謄本所載資料計算或申請⼈亦得⾃行舉證其他政府機關核發之證明文件，如房 \n屋稅籍資料等，並由地方主管機關審認。 \n如建築物有非住宅使用情形者，則不得申請本計畫補助。"}, {"code": "B-05", "category": "B", "categoryName": "法令適用篇", "num": 5, "question": "老宅延壽補助是否要經全體同意才能申請？", "answer": "(1)4~6層樓公寓住宅: \n①已成立公寓大廈管理委員會或管理負責⼈者：應依公寓大廈管理相關規定，經區分 \n所有權⼈會議決議通過後，由管理委員會或管理負責⼈提出申請。 \n②未成立公寓大廈管理委員會或管理負責⼈者：應由全體區分所有權⼈同意推派1⼈\n代表提出申請。 \n(2)6層樓以下透天住宅: \n如為2⼈以上共有者，應取得全體所有權⼈同意並推派代表1⼈提出申請。"}, {"code": "B-06", "category": "B", "categoryName": "法令適用篇", "num": 6, "question": "未成立公寓大廈管理委員會，如何申請共用部分修繕申請？", "answer": "如無管委會或管理負責⼈者，則由全體區分所有權⼈同意並推派代表⼈申請共有部分 \n修繕補助；另如6樓以下透天住宅2⼈以上共有者，則需要取得全體所有權⼈同意並 \n推派代表⼈申請。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nB-3"}, {"code": "B-07", "category": "B", "categoryName": "法令適用篇", "num": 7, "question": "如果「公寓」整棟建築物都是由單⼀所有權⼈持有，還可以申請修繕 補助？", "answer": "不可以，依補助辦法規定，如全棟建築物為單⼀所有權⼈持有，不得申請。"}, {"code": "B-08", "category": "B", "categoryName": "法令適用篇", "num": 8, "question": "如果社區已經進入都市更新或危老重建的程序，並且已經報核事業計 畫或重建計畫，是否還可以申請修繕補助？", "answer": "不可以，依補助辦法規定，如已進行都市更新或危險及老舊建築物重建程序，且已報 \n核都市更新事業計畫或已申請重建計畫，均不得申請公寓或透天住宅建築物修繕補 \n助。"}, {"code": "B-09", "category": "B", "categoryName": "法令適用篇", "num": 9, "question": "如何成立公寓大廈管理委員會？", "answer": "依公寓大廈管理條例第30條規定成立管委會程序如下： \n(1)推舉有權利召集「區分所有權⼈會議」的召集⼈:由區分所有權⼈2⼈以上互推⼀⼈ \n作為召集⼈，來召開區分所有權⼈的會議。如果是首次召開，通常由建築物的起造⼈ \n來召開。 \n(2)召集合於法定程序的區分所有權⼈會議:會議需提前10天以書面形式通知，並明確 \n載明會議的內容。選舉管理委員的事宜必須在會議通知中公告，不能以臨時提案進行 \n選舉。開會時，需有全體區分所有權⼈及所有比率2／3以上。如果未達此數，則可 \n重新召開。第⼆次會議門檻降低為3⼈並1／5以上所有權⼈及所有權比例出席，決議 \n的通過則需要出席⼈數及所有權比率3／4以上同意。 \n(3)公告與通知住戶會議中決議的內容:開完會後15日內需將開 會中的會議紀錄（須載 \n明開會經過及決議事項並由主席簽名）送達每位區分所有權⼈並進行公告。倘若為流 \n會後重新召開 的會議（⼜稱假決議），也是⼀樣需在15日內將會議紀錄送 達各區分 \n所有權⼈且公告，若在7日內未有全體1／2以上書 面反對，則該決議視為成立，在成 \n立後10日內以書面送達各 區分所有權⼈並公告。 \n(4)向地方政府報備。   \n \n老宅延壽機能復新補助計畫   \n \n \nB-4"}, {"code": "B-10", "category": "B", "categoryName": "法令適用篇", "num": 10, "question": "如何推派管理負責⼈？", "answer": "按公寓大廈管理條例第3條第10款規定，管理負責⼈係指未成立管理委員會，由區分 \n所有權⼈推選住戶1⼈或依第28條第3項、第29條第6項規定為負責管理公寓大廈事務 \n者；⼀般為所有權⼈數較少、區分所有建築物規模較⼩或社區管理事務單純易管理者 \n（戶數少）。如區分所有權⼈無法互推召集⼈或申請指定臨時召集⼈時，區分所有權 \n⼈得申請直轄市、縣 (市)主管機關指定住戶1⼈為管理負責⼈，其任期至成立管理委 \n員會、推選管理負責⼈或互推召集⼈為止。"}, {"code": "B-11", "category": "B", "categoryName": "法令適用篇", "num": 11, "question": "「棟」的定義為何？「戶」如何的認定？", "answer": "老宅延壽補助計畫所稱以「棟」為補助單位，原則係以單⼀共同樓梯及出入口為1\n棟。「戶」係指建築物內可獨立使用且可分別登記所有權的單位，⼀般多以分層所有 \n登記或門牌及所有權⼈欄位來查驗。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nB-5"}, {"code": "B-12", "category": "B", "categoryName": "法令適用篇", "num": 12, "question": "我家在工業區(商業區、農業區、保護區…)，可以申請補助嗎?", "answer": "(1)本計畫的目的是為了改善並優化老舊建築物機能與無障礙空間品質，增進高齡者 \n行動的便利性及居住舒適性，故補助辦法係規範以合法住宅為主，並以直轄市、縣 \n(市)主管 機關核發「使用執照」登載為準。如果無法出具使用執照 者，就以地政機 \n關核發之「建物登記謄本」所載資料為準。 \n(2)工業區、工業用地或⼀般所稱之工業住宅無法申請補助，但商業區、農業區及保 \n護區則需認定屬於住宅使用的合法建築物就可以申請。如果還有疑問可進⼀步洽詢所 \n在地之主管機關協助認定。 \n(3)另位於商業區之建築物，如整棟均屬住宅使用，仍得依規定申請本計畫補助。"}, {"code": "B-13", "category": "B", "categoryName": "法令適用篇", "num": 13, "question": "頂樓加蓋、前後陽台外推或搭建部分也可以申請補助嗎?", "answer": "(1) 不可以。頂樓加蓋、前後陽台外推或搭建部分等違章建築不屬於本計畫補助範 \n圍。 \n(2)老宅延壽補助計畫係針對全臺屋齡30年以上4至6樓以住宅為主之公寓以及6樓以 \n下透天住宅之「合法建築物」為補助標的；有關合法建築物之認定，應依據使用執照 \n或經地方政府認定之合法建築物證明文件為準。故申請補助之修繕內容，應在合法建 \n築物之範圍內，才符合申請補助之要件。 \n(3)另公寓類型建築物，如進行老舊招牌、違規物或違建拆除，相關拆除工程費用有 \n補助(6樓以下透天住宅，不得申請「老舊招牌、違規物或違章建築拆除工程」相關補 \n助。)。 \n \n答： \n(1)依補助辦法規定，申請公寓建築物共有部分修繕補助者，全棟範圍內設籍之戶籍 \n成員至少1⼈應符合年滿65歲以上⻑者、低收、中低收入戶或⻑照需要等級2級以上 \n（並符合居家無障礙改善補助）等其中⼀項條件。"}, {"code": "B-15", "category": "B", "categoryName": "法令適用篇", "num": 15, "question": "我想成立公寓大廈管理委員會，各地方政府有諮詢窗口可以詢問嗎?", "answer": "有，各縣市政府公寓大廈業務諮詢單位及電話如下： \n縣(市)政府  單位名稱  連絡資訊  \n臺北市政府  建管處公寓大廈管理科  (02)27208889-8388  \n新北市政府  工務局公寓大廈管理科  (02)2960-3456-7760、7761  \n基隆市政府  都市發展局使用管理科  (02)2420-1122-1818-1821  \n桃園市政府  建築管理處公寓大廈科  (03)3322101-6708~6711  \n新竹市政府  都市發展處使用管理科  (03)5263808-312  \n新竹縣政府  工務處使用管理科  (03)5518101-6369、6370  \n台中市政府  住宅發展工程處公寓大廈管理科  (04)22289111-69517  \n苗栗縣政府  工商發展處使用管理科  037-559848/037-559861  \n彰化縣政府  建設處使用管理科  (04)7531217  \n南投縣政府  建設處使用管理科  (049)2227300  \n雲林縣政府  建設處使用管理及國宅科  (05)5522183  \n高雄市政府  工務局建築管理處第六課  (07)3368333-5341、2423、2424、2425、\n2426、2427  \n臺南市政府  工務局使用管理科  (06)299-1111-8666  \n嘉義市政府  工務處使用管理科  (05)225-4321-323、214  \n嘉義縣政府  經濟發展處使用管理科  (05)3620123-8094、8603、8602  \n屏東縣政府  城鄉發展處公安使用科  (08)7320415-3360~3369  \n澎湖縣政府  建設處建築管理科  (06)9274400-409  \n宜蘭縣政府  建設處使用管理科  (03)9251000-1333、1330  \n花蓮縣政府  建設處建築管理科  (03)8230510  \n臺東縣政府  建設處建築管理科  (089)340416、(089)326141-342  \n金門縣政府  城鄉發展處建築管理科  (082)312876、(082)322512  \n連江縣政府  工務處都計建管科  (0836)25330-6338  \n \n \n \n老宅延壽機能復新補助計畫"}, {"code": "C-01", "category": "C", "categoryName": "補助項目篇", "num": 1, "question": "辦理結構安全性能 (耐震能力)評估，每棟最高可以補助多少費用？", "answer": "（1）初步結構安全性能評估依建築物規模提供補助： \n總樓地板面積未達3,000平方公尺：每棟最高補助新臺幣 1萬2,000元。 \n總樓地板面積3,000平方公尺以上：每棟最高補助新臺幣 1萬5,000元。 \n（2）詳細結構安全性能評估 \n每棟最高補助新臺幣40萬元。 \n補助金額以實際評估費用30%為限。 \n（3）結構安全性能評估得與修繕補助同時申請；即使後續修繕補助未獲核准，評估 \n費用仍可依相關規定申請補助。"}, {"code": "C-02", "category": "C", "categoryName": "補助項目篇", "num": 2, "question": "公寓申請共用及室內專有部分修繕補助項目為何？最高可以獲得多少 補助比例？", "answer": "(1)公寓申請共用部分修繕補助項目有8項包含:增設昇降設備、 樓梯間修繕、 公\n共管線修繕更新工程、 老舊招牌、違規物或違建拆除工程、 建築物立面修繕、 \n屋頂防水及隔熱工程、 外掛式空調及外部管線之安全改善工程、 增設或改善無障 \n礙設施。 \n其中，「屋頂防水及隔熱工程」補助項目，不包含以鐵⽪搭設作為防水用途之屋頂。 \n另，「無障礙設施」補助項目，不包含爬梯機、樓梯升降椅等設備。 \n(2)公寓申請室內專有部分修繕補助項目有2項包含:居家安全及無障礙設施設備修繕 \n管線修繕更新。 \n其中，「無障礙設施」補助項目，不包含爬梯機、樓梯升降椅等設備。 \n另，室內專有部分修繕之補助內容，須係配合辦理「居家安全及無障礙設施設備修 \n繕」或「管線修繕更新」所衍⽣之相關裝修工程，始得納入補助範圍。 \n(3)公寓申請建築物共有及室內專有部分修繕之補助額度，係以實際修繕金額核算， \n各工程項目補助額度均有其上限，且不得超過該項工程經費之65%。"}, {"code": "C-03", "category": "C", "categoryName": "補助項目篇", "num": 3, "question": "公寓「增設」昇降設備（電梯），最高可以獲得多少補助額度？", "answer": "增設昇降設備補助上限為每棟400萬。既有電梯設備之修繕，不得申請本計畫補助。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nC-2"}, {"code": "C-04", "category": "C", "categoryName": "補助項目篇", "num": 4, "question": "公寓進行建築物立面（外牆）修繕，最高可以獲得多少補助？有無單 價上限之限制？門窗或鐵門等之更換是否也有補助?", "answer": "建築物立面（外牆）修繕補助上限為每棟300萬元。其補助額度，係以實際施作工程 \n面積核算(且應扣除開口面積)，補助單價以3,500/m2為上限。門窗或鐵門等之更換 \n不屬於補助範圍。"}, {"code": "C-05", "category": "C", "categoryName": "補助項目篇", "num": 5, "question": "除了立面修繕，補助項目有包括老舊招牌、違規物或違建的拆除工 程？最高補助額度是多少？", "answer": "有的，老舊招牌、違規物或違建拆除工程補助上限為每棟40萬(註：透天住宅拆除違 \n建不補助)。"}, {"code": "C-06", "category": "C", "categoryName": "補助項目篇", "num": 6, "question": "公寓申請公共管線修繕更新工程（如給排水、電氣管線），每棟最高 可以補助多少？", "answer": "公共管線修繕更新工程補助上限為每棟50萬。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nC-3"}, {"code": "C-07", "category": "C", "categoryName": "補助項目篇", "num": 7, "question": "我是4樓的透天住宅，申請建築物立面修繕，最高補助額度是多少？", "answer": "透天住宅之建築物立面修繕費用，是以樓層數、分級距計算， 3至4層樓補助上限為 \n每棟200萬。"}, {"code": "C-08", "category": "C", "categoryName": "補助項目篇", "num": 8, "question": "透天住宅除了立面和屋頂外，還可以申請哪些修繕補助項目？", "answer": "為強化對高齡族群居住安全之保障，透天住宅得申請增設或改善室外無障礙設施以及 \n室內修繕補助項目如下: \n(1)居家安全及無障礙設施設備修繕：包括扶手更新或加裝、高低差改善、門扇改 \n善、地面防滑及防墜設施。  \n(2)管線修繕更新：給排水、電氣及燃氣管線。  \n(3)配合前⼆款所需之必要室內裝修。 \n(4)其中之「無障礙設施」不包括爬梯機、樓梯升降椅等。但廁 所內的扶手、止滑設 \n施、順平等無障礙設施可以補助；另建 築線至出入口之無障礙設施或至電梯之無障 \n礙設施可以補助。"}, {"code": "C-09", "category": "C", "categoryName": "補助項目篇", "num": 9, "question": "申請「專有部分」（室內）修繕補助的項目有哪些？", "answer": "為強化對高齡族群居住安全之保障，有關室內修繕補助項目如下: \n(1)居家安全及無障礙設施設備修繕：包括扶手更新或加裝、高低差改善、門扇改 \n善、地面防滑及防墜設施。 \n(2)管線修繕更新：給排水、電氣及燃氣管線。  \n(3)配合前⼆款所需之必要室內裝修。 \n(4)其中之「無障礙設施」不包括爬梯機、樓梯升降椅等。但廁所內的扶手、止滑設 \n施、順平等無障礙設施可以補助；另建築線至出入口之無障礙設施或至電梯之無障礙 \n設施可以補助。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nC-4"}, {"code": "C-10", "category": "C", "categoryName": "補助項目篇", "num": 10, "question": "申請專有部分修繕時，是否⼀定要同時申請共用部分修繕？", "answer": "是的，按補助辦法規定，申請⼈應先申請公寓共有部分修繕補助項目3項以上，才可 \n以申請專有部分修繕補助。"}, {"code": "C-11", "category": "C", "categoryName": "補助項目篇", "num": 11, "question": "高齡弱勢如何加碼?身分如何認定?", "answer": "為強化對高齡及弱勢族群居住安全之保障，申請室內修繕補助，其補助範圍內戶籍成 \n員有符合下列條件之⼀，可以提高補助，最高以新臺幣30萬元為限，包括: \n(1)年滿65歲以上⻑者。 \n(2)具低收入戶或中低收入戶資格。 \n(3)依⻑期照顧服務申請及給付辦法規定，屬⻑照需要等級第 2級以上，且符合居家無 \n障礙環境改善補助對象者。 \n(4)是否有高齡⼈口居住，以申請當時之資料為準。"}, {"code": "C-12", "category": "C", "categoryName": "補助項目篇", "num": 12, "question": "如果我已經因為⻑照需求申請過衛福部的居家無障礙環境改善補助， 是否還可以申請老宅延壽的室內無障礙環境改善補助?", "answer": "原則不得重複申請相同補助項目；但如果曾申請補助之居家無障礙環境改善項目，已 \n超過使用年限或損壞不堪使用者，還是可以提出申請。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nC-5"}, {"code": "C-13", "category": "C", "categoryName": "補助項目篇", "num": 13, "question": "透天住宅申請室外及室內部分修繕補助項目為何？最高可以獲得多少 補助比例？", "answer": "(1)透天住宅申請室外部分修繕補助項目有4項包含: 建築物立面修繕、 屋頂防水及 \n隔熱工程、 外掛式空調及外部管線之安全改善工程、 增設或改善室外無障礙設 \n施。 \n補助項目中「屋頂防水及隔熱」之補助不包括防水用鐵⽪屋頂之補助。 \n其中之「增設或改善室外無障礙設施」係指建築線至出入口之無障礙設施或至電梯之 \n無障礙設施可以補助。 \n(2)透天住宅申請室內部分修繕補助項目有2項包含:居家安全及無障礙設施設備修繕 \n管線修繕更新。 \n其中「無障礙設施設備修繕」不包括爬梯機、樓梯升降椅等，但廁所內的扶手、止滑 \n設施、順平等無障礙設施可以補助。 \n(3)透天住宅申請建築物室外及室內部分修繕之補助額度，係以實際修繕金額核算， \n各工程項目補助額度均有其上限，且不得超過該項工程經費之65%。"}, {"code": "C-14", "category": "C", "categoryName": "補助項目篇", "num": 14, "question": "由建築師或相關專業團體協助整合、規劃、設計、執照申請及監造等 費用是否可以納入作業補助作業費？", "answer": "可以。公寓共用部分修繕補助，除工程補助外，另提供「共用部分作業費用」補助， \n每棟最高補助新臺幣1萬元，補助內容包括委託專業者辦理整合協調、專業評估及協 \n助提案等相關作業；經地方政府審查核准後撥付。另針對部分額外補助項目，包含 \n「增設昇降設備」及「建築物立面修繕」，每棟各最高得補助新臺幣5萬元，且得累 \n計申請；相關補助款項於工程施工完成，並經地方政府辦理成果備查後撥付。"}, {"code": "C-15", "category": "C", "categoryName": "補助項目篇", "num": 15, "question": "施工中或已完工的申請案件，可以申請補助嗎。", "answer": "不行。施工中或已完工的申請案件，不得溯及既往申請補助。 本補助辦法規定，申 \n請⼈申請老宅修繕補助，應檢具相關文  件向直轄市、縣（市）政府申請、經審查及 \n核准後始能施工  及核發補助，故施工中或已完工的申請案件不可以申請補助。 \n \n \n \n老宅延壽機能復新補助計畫"}, {"code": "D-01", "category": "D", "categoryName": "申請與施工篇", "num": 1, "question": "我申請的補助案件，是由中央還是由地方政府來受理及審查？", "answer": "老宅延壽補助案件之「受理」及「審查」主要係由各直轄市、縣（市）政府辦理。流 \n程包括： \n1.由直轄市、縣（市）政府公告受理補助申請。 \n2.申請⼈向直轄市、縣（市）政府提出補助申請。 \n3.由直轄市、縣（市）政府受理案件並進行審查。 \n4.如資料不足，由地方政府通知限期補正；補正不完全者得駁回申請。 \n5.審查通過後，由地方政府核准補助及後續撥款。 \n至於中央政府（內政部國土管理署）主要係負責政策推動、補助制度建立、評估機構 \n評定及中央輔導機制，實際案件之行政受理與審查作業，仍以地方政府為執行窗口。"}, {"code": "D-02", "category": "D", "categoryName": "申請與施工篇", "num": 2, "question": "申請修繕補助獲得核准後，申請⼈需要在多久內完成施工？如果無法 如期完成，可以展延嗎？", "answer": "(1)申請⼈應於直轄市、縣（市）政府核發補助核准函之日起1年內完成施工。如申請 \n增設昇降設備者，則應於核發補助核准函之日起1年內送件申請昇降設備使用許可。 \n(2)因故未能於期限內完成者，申請⼈得敘明理由申請展期；展期之期限不得逾6個\n月，並以2次為限。未申請展延者，其補助核准⾃動失效。"}, {"code": "D-03", "category": "D", "categoryName": "申請與施工篇", "num": 3, "question": "增設昇降設備的補助案，是否有特別的施工期限要求？", "answer": "申請增設昇降設備者，申請⼈應於直轄市、縣（市）政府核發補助核准函之日起1年\n內送件申請昇降設備使用許可。 \n  \n \n老宅延壽機能復新補助計畫   \n \n \nD-2"}, {"code": "D-04", "category": "D", "categoryName": "申請與施工篇", "num": 4, "question": "申請建築物修繕補助時，需要準備哪些主要的證明文件？", "answer": "(1)申請書、切結書 \n(2)申請⼈身分證明文件:公寓大廈管理組織報備證明文件、管理負責⼈或全體共同代 \n表⼈名冊(含姓名、聯絡地址及身分證明文件影本)、建物所有權⼈或共同代表⼈身分 \n證明文件 (含姓名、聯絡地址及身分證明文件影本)。 \n(2)同意書或區權會議決議證明:區分所有權⼈會議紀錄或區分所有權⼈全體同意修繕 \n同意書。 \n(3)近3個月內建築物登記第1類或第3類謄本。 \n(4)使用執照或舊有房屋證明+建物登記謄本+建物測量成果圖。 \n(5)高齡弱勢證明文件:符合補助辦法第12條第2項各款身份之1證明文件(年滿65歲以 \n上者之戶口名簿影本或戶籍謄本、中低收入戶證明文件、⻑照需要等級2級以上證明 \n文件)。 \n(6)結構安全性能評估報告書影本。 \n(7)施工廠商簽約證明影本(契約書影本或報價單)。 (8)其他證明文件。 \n \n \n答： ⺠眾申請老宅延壽補助步驟可分為3個階段，申請說明及流程圖如下： \n(1)第⼀階段:修繕需求申請，申請⼈填寫基本資料（含聯絡方式、申請範圍）及補助項 \n目，並授權地方服務團隊調閱建物謄本、合法房屋證明、使用執照、竣工圖及測量成 \n果圖等文件由地方政府或服務團隊協助檢核身分是否符合補助規定，並主動接洽社區 \n提供諮詢輔導。 \n(2)第⼆階段：修繕補助計畫申請，申請⼈或申請⼈委託專業者於公告受理期間，向地 \n方政府提出修繕補助計畫申請。 \n(3)第三階段：施工及請款，經地方政府核定補助後，申請案件進入施工階段，原則須 \n於1年內完工，並得視情形申請展延6個月，最多2次為限。"}],

    function initEngine() {

      // 相機 FOV 調為 30，營造桌面積木玩具微縮感
      camera = new THREE.PerspectiveCamera(30, w / h, 0.3, 350);
      camera.position.set(9.2, 12.8, 15.6);

      // WebGL Renderer (消光柔和黏土質感)
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // 2D 標籤渲染器
      labelRenderer = new CSS2DRenderer();
      labelRenderer.setSize(w, h);
      labelRenderer.domElement.style.position = 'absolute';
      labelRenderer.domElement.style.top = '0';
      labelRenderer.domElement.style.pointerEvents = 'none';
      container.appendChild(labelRenderer.domElement);

      // OrbitControls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.12;
      controls.minDistance = 6;
      controls.maxDistance = 50;
      controls.target.set(0, 0.35, 0);

      setupLights();
      createDynamicOcean();
      buildIslands();
      connectArchedBridges();
      createOuterMiniIslets();
      createMiniSailboats();

      window.addEventListener('resize', onResize);

        }
      }, 600);

      animate();
    }

      ambLight = new THREE.AmbientLight(THEMES.day.ambColor, THEMES.day.ambIntensity);

      hemiLight = new THREE.HemisphereLight(THEMES.day.hemiSky, THEMES.day.hemiGround, THEMES.day.hemiIntensity);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(THEMES.day.sunColor, THEMES.day.sunIntensity);
      sunLight.position.set(14, 26, 18);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 70;
      const d = 12;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0004;
      sunLight.shadow.normalBias = 0.03;
      sunLight.shadow.radius = 2.2;
      scene.add(sunLight);
    }

    function createDynamicOcean() {
      const size = 120;
      oceanGeo = new THREE.PlaneGeometry(size, size, 50, 50);
      oceanGeo.rotateX(-Math.PI / 2);

      const pos = oceanGeo.attributes.position;
      wavePositions = pos.clone();
      waveBaseY = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        waveBaseY[i] = pos.getY(i);
      }

      const oceanMat = new THREE.MeshStandardMaterial({
        color: THEMES.day.sea,
        roughness: 0.35,
        metalness: 0.05,
        flatShading: true
      });

      oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
      oceanMesh.position.y = WATER_Y;
      oceanMesh.receiveShadow = true;
      scene.add(oceanMesh);
    }

      const pathRingMat = new THREE.MeshStandardMaterial({ color: 0xd28872, roughness: 0.9, flatShading: true }); // 淺磚色環形走道
      const foamRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, side: THREE.DoubleSide }); // 白色浪花環

      DATA.islands.forEach((isleData) => {
        const pos = isleData.worldPos;
        const isleGroup = new THREE.Group();
        isleGroup.position.set(pos.x, 0, pos.z);
        isleGroup.userData = { isle: isleData };

        // 六角島基座 (微縮黏土消光)
        const topGeo = new THREE.CylinderGeometry(R, R + 0.2, TOP, 6);
        const islandTop = new THREE.Mesh(topGeo, clayStoneMat);
        islandTop.position.y = TOP / 2;
        islandTop.rotation.y = Math.PI / 6;
        islandTop.receiveShadow = true;
        islandTop.castShadow = true;
        isleGroup.add(islandTop);

        // 每座島表面邊緣加入一圈淺磚色環形走道
        const pathRingGeo = new THREE.RingGeometry(R - 0.24, R - 0.03, 6);
        const pathRing = new THREE.Mesh(pathRingGeo, pathRingMat);
        pathRing.rotation.x = -Math.PI / 2;
        pathRing.rotation.z = Math.PI / 6;
        pathRing.position.y = TOP + 0.005;
        pathRing.receiveShadow = true;
        isleGroup.add(pathRing);

        // 水線處白色浪花環
        const rimGeo = new THREE.RingGeometry(R + 0.03, R + 0.28, 6);
        const rim = new THREE.Mesh(rimGeo, foamRingMat);
        rim.rotation.x = -Math.PI / 2;
        rim.rotation.z = Math.PI / 6;
        rim.position.y = WATER_Y + 0.02;
        isleGroup.add(rim);

        // 3D 浮動導覽標籤
        const badgeDiv = document.createElement('div');
        badgeDiv.className = 'island-badge-label';
        badgeDiv.innerHTML = `📍 ${isleData.name}`;
        badgeDiv.onclick = (e) => {
          e.stopPropagation();
          flyToIsland(isleGroup.position, isleData);
        };
        const cssLabel = new CSS2DObject(badgeDiv);
        cssLabel.position.set(0, TOP + 1.85, 0);
        isleGroup.add(cssLabel);

        // 島上建築、街道家具與植被
        decorateIsland(isleGroup, isleData.id);

        scene.add(isleGroup);
        islandMeshes.push(islandTop);
        islandGroups[isleData.id] = isleGroup;
      });
    }

    // -----------------------------------------------------------------
    // 5. 7 片微弧度精緻木甲板拱橋 (中央島 ➔ 4 鄉)
    // -----------------------------------------------------------------
    function connectArchedBridges() {
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x936639, roughness: 0.88, flatShading: true });
      const railMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.75 });

      const centerPos = DATA.islands[0].worldPos; // Center: (0, 0)
      const townships = DATA.islands.slice(1); // Nangan, Beigan, Juguang, Dongyin

      townships.forEach((t) => {
        const destPos = t.worldPos;
        const dist = Math.hypot(destPos.x - centerPos.x, destPos.z - centerPos.z);
        const dirX = (destPos.x - centerPos.x) / dist;
        const dirZ = (destPos.z - centerPos.z) / dist;

        // 起點與終點緊密銜接島面邊緣
        const startR = R - 0.15;
        const endR = R - 0.15;
        const startX = centerPos.x + dirX * startR;
        const startZ = centerPos.z + dirZ * startR;
        const endX = destPos.x - dirX * endR;
        const endZ = destPos.z - dirZ * endR;

        const plankCount = 7; // 精緻的 7 片微弧度木甲板
        const spanDist = Math.hypot(endX - startX, endZ - startZ);
        const plankLen = (spanDist / plankCount) * 0.92;
        const angle = Math.atan2(dirX, dirZ);

        for (let i = 0; i < plankCount; i++) {
          const u = (i + 0.5) / plankCount;
          const px = startX + (endX - startX) * u;
          const pz = startZ + (endZ - startZ) * u;
          // 微弧度弧線
          const archH = Math.sin(u * Math.PI) * 0.11;
          const py = TOP - 0.02 + archH;

          // 木甲板
          const plank = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.035, plankLen), woodMat);
          plank.position.set(px, py, pz);
          plank.rotation.y = angle;
          plank.rotation.x = -Math.cos(u * Math.PI) * 0.12;
          plank.castShadow = true; plank.receiveShadow = true;
          scene.add(plank);

          // 扶手立柱 (每隔 2 片放置一根)
          if (i % 2 === 0) {
            const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16), railMat);
            const perpX = -dirZ * 0.15;
            const perpZ = dirX * 0.15;
            pL.position.set(px + perpX, py + 0.08, pz + perpZ);

            const pR = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16), railMat);
            pR.position.set(px - perpX, py + 0.08, pz - perpZ);

            scene.add(pL, pR);
          }
        }
      });
    }

    window.tourPrev = function() {
      if (tourCurrentIndex <= 0) tourCurrentIndex = TOUR_STOPS.length - 1;
      else tourCurrentIndex--;
      goToTourStop(tourCurrentIndex);
    };

    window.tourNext = function() {
      if (tourCurrentIndex >= TOUR_STOPS.length - 1) tourCurrentIndex = 0;
      else tourCurrentIndex++;
      goToTourStop(tourCurrentIndex);
    };

    window.toggleTourPlay = function() {
      isTourPlaying = !isTourPlaying;
      const btn = document.getElementById('btn-tour-play');
      if (isTourPlaying) {
        btn.innerText = '⏸ 導覽暫停';
        btn.classList.add('active');
        if (tourCurrentIndex === -1) tourCurrentIndex = 0;
        goToTourStop(tourCurrentIndex);
        startTourTimer();
      } else {
        btn.innerText = '▶ 導覽播放';
        btn.classList.remove('active');
        stopTourTimer();
      }
    };

    function startTourTimer() {
      stopTourTimer();
      tourTimer = setInterval(() => {
        if (isTourPlaying) {
          tourCurrentIndex = (tourCurrentIndex + 1) % TOUR_STOPS.length;
          goToTourStop(tourCurrentIndex);
        }
      }, 4500);
    }

    function stopTourTimer() {
      if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
    }

    function goToTourStop(idx) {
      const stopId = TOUR_STOPS[idx];
      const isleData = DATA.islands.find(i => i.id === stopId);
      if (!isleData) return;

      const indicator = document.getElementById('tour-indicator');
      if (indicator) {
        indicator.innerText = `【第 ${idx + 1}/5 站：${isleData.name}】`;
      }

      const group = islandGroups[stopId];
      if (group) {
        flyToIsland(group.position, isleData);
      }
    }

    // 點擊島嶼與平滑運鏡
    function onPointerClick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(islandMeshes, true);
      if (hits.length > 0) {
        let hitObj = hits[0].object;
        while (hitObj.parent && !hitObj.userData.isle) {
          hitObj = hitObj.parent;
        }
        if (hitObj.userData.isle) {
          const isleData = hitObj.userData.isle;
          const stopIdx = TOUR_STOPS.indexOf(isleData.id);
          if (stopIdx !== -1) {
            tourCurrentIndex = stopIdx;
            document.getElementById('tour-indicator').innerText = `【第 ${stopIdx + 1}/5 站：${isleData.name}】`;
          }
          flyToIsland(hitObj.position, isleData);
        }
      }
    }

    function flyToIsland(targetPos, data) {
      isFlying = true;
      flyProgress = 0;
      flyStartPos.copy(camera.position);
      flyStartLook.copy(controls.target);

      flyEndLook.set(targetPos.x, TOP, targetPos.z);
      // FOV 30 緊湊視角
      flyEndPos.set(targetPos.x + 2.5, TOP + 3.8, targetPos.z + 4.9);

      showDetailCard(data);
    }

    function showDetailCard(data) {
      const card = document.getElementById('detail-card');
      document.getElementById('card-badge').innerText = data.name;
      document.getElementById('card-title').innerText = data.landmark;
      document.getElementById('card-sub').innerText = data.sub;
      document.getElementById('card-desc').innerText = data.desc;

      const statsContainer = document.getElementById('card-stats');
      statsContainer.innerHTML = data.stats.map(s => `
        <div class="stat-box">
          <div class="val">${s.val}</div>
          <div class="lbl">${s.label}</div>
        </div>
      `).join('');

      document.getElementById('card-extra').innerText = data.extra;
      card.classList.remove('hidden');
    }

      document.getElementById('detail-card').classList.add('hidden');

      document.querySelectorAll('#hud-bottom .hud-btn').forEach(b => b.classList.remove('active'));

    // 試算器計算核心
    window.calcNow = function() {
      const bType = document.getElementById('calc-btype').value;
      const item = document.getElementById('calc-item').value;
      const cost = parseFloat(document.getElementById('calc-cost').value) || 0;
      const area = parseFloat(document.getElementById('calc-area').value) || 0;
      const isVul = parseInt(document.getElementById('calc-vulnerable').value) || 0;

      const v1 = cost * 0.65;
      let v2 = 999999;
      if (area > 0 && (item === 'facade' || item === 'roof')) {
        v2 = (area * 3500) / 10000;
      }

      let v3 = 999999;
      if (bType === 'apt') {
        if (item === 'elevator') v3 = 400;
        else if (item === 'facade') v3 = 300;
        else if (item === 'roof') v3 = 150;
        else if (item === 'pipe') v3 = 200;
        else if (item === 'barrier') v3 = 50;
        else if (item === 'interior') v3 = isVul ? 30 : 20;
        else v3 = 300;
      } else {
        if (item === 'facade') v3 = 200;
        else if (item === 'roof') v3 = 20;
        else if (item === 'pipe') v3 = 30;
        else if (item === 'barrier') v3 = 30;
        else if (item === 'interior') v3 = isVul ? 30 : 20;
        else v3 = 100;
      }

      let grant = Math.min(v1, v2, v3);
      if (grant < 0) grant = 0;
      grant = Math.round(grant * 10) / 10;
      let selfPay = Math.max(0, cost - grant);
      selfPay = Math.round(selfPay * 10) / 10;
      let pct = cost > 0 ? Math.round((selfPay / cost) * 1000) / 10 : 0;

      document.getElementById('res-grant').innerText = grant.toFixed(1) + ' 萬';
      document.getElementById('res-selfpay').innerText = selfPay.toFixed(1) + ' 萬';
      document.getElementById('res-pct').innerText = pct.toFixed(1) + '%';

      let desc = '核定金額依合約總報價 65% 計算，全額核發。';
      if (grant === v3 && v3 < v1) {
        desc = `⚠️ 受【法定上限管制】約束，補助款達到單項天花板上限 ${v3} 萬元。`;
      } else if (grant === v2 && v2 < v1) {
        desc = `⚠️ 受【單價管制 (3,500元/㎡)】約束，核定依面積上限核給 ${v2.toFixed(1)} 萬元。`;
      }
      if (item === 'interior' && isVul) {
        desc += '（含高齡/弱勢戶加碼 30 萬元全額保障）';
      }
      document.getElementById('res-rule-desc').innerText = desc;
    };

    window.loadScenario = function(sid) {

      document.getElementById('calc-btype').value = s.type;
      document.getElementById('calc-cost').value = s.cost || 100;
      document.getElementById('calc-area').value = s.area || 0;

      if (s.title.includes('電梯')) document.getElementById('calc-item').value = 'elevator';
      else if (s.title.includes('立面')) document.getElementById('calc-item').value = 'facade';
      else if (s.title.includes('防水') || s.title.includes('隔熱')) document.getElementById('calc-item').value = 'roof';

      else if (s.title.includes('無障礙')) document.getElementById('calc-item').value = 'barrier';
      else if (s.title.includes('室內')) document.getElementById('calc-item').value = 'interior';

      document.getElementById('calc-vulnerable').value = (s.title.includes('弱勢') || s.rule.includes('弱勢')) ? '1' : '0';

    // -----------------------------------------------------------------
    // 9. 動畫渲染循環 (平滑飛行、海浪微波、小船巡弋、燈塔光束)
    // -----------------------------------------------------------------
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. 動態正弦海浪微波
      if (oceanGeo && waveBaseY) {
        const pos = oceanGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const u = wavePositions.getX(i);
          const v = wavePositions.getZ(i);
          const w = Math.sin(u * 0.12 + time * 1.6) * 0.045 + Math.cos(v * 0.12 + time * 1.3) * 0.035;
          pos.setY(i, waveBaseY[i] + w);
        }
        pos.needsUpdate = true;
      }

      // 2. 紅白色小帆船環遊巡弋與微晃
      sailboats.forEach((b) => {
        b.userData.angle += b.userData.speed;
        const ang = b.userData.angle;
        const rad = b.userData.radius;
        b.position.x = Math.cos(ang) * rad;
        b.position.z = Math.sin(ang) * rad;
        b.position.y = WATER_Y + 0.01 + Math.sin(time * 2.5 + ang * 2) * 0.02;
        b.rotation.y = -ang + Math.PI / 2;
        b.rotation.z = Math.sin(time * 3 + ang) * 0.06; // 隨浪輕晃
      });

      // 3. 東引燈塔光束旋轉
      if (lighthouseBeam) {
        lighthouseBeam.rotation.y += 0.018;
      }

      // 4. 相機平滑飛行動畫 (Lerp)
      if (isFlying) {
        flyProgress += delta * 1.25;
        if (flyProgress >= 1) {
          flyProgress = 1;
          isFlying = false;
        }
        const t = easeOutCubic(flyProgress);
        camera.position.lerpVectors(flyStartPos, flyEndPos, t);
        controls.target.lerpVectors(flyStartLook, flyEndLook, t);
      }

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }
